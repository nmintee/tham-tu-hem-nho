<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Game trinh thám tiếng Việt: đọc tin nhắn, lướt web, ghim manh mối và gọi tên thủ phạm.">
<meta name="theme-color" content="#141826">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Thám Tử Hẻm Nhỏ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Patrick+Hand&display=swap&subset=vietnamese">
<style>
/* Layout: one-screen fake desktop ("Phố Xanh") — start screen → desktop with menubar, draggable windows, dock. Single deliberate look (night alley + daytime desktop). */
:root{
  --night:#141826; --night-2:#232a44; --lamp:#ffb347; --lamp-soft:#ffd9a0;
  --desk-a:#2d6f73; --desk-b:#7fb7a4; --desk-c:#e9c98f;
  --win:#fbfbf9; --win-2:#f0f1ee; --line:#dfe1dc; --ink:#1f2328; --ink-2:#5c6370; --ink-3:#8b919b;
  --accent:#e2683c; --accent-ink:#fff; --chat-me:#d8efe6; --ok:#2f8f5b; --bad:#c84a3a;
  --paper:#fff8e7; --paper-line:#e8dcbc;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
html,:root,:root[data-theme]{color-scheme:light!important}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{color:var(--ink);font:inherit}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:1}
#desk{color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}

/* ---------- START SCREEN ---------- */
#start{position:absolute;inset:0;display:flex;align-items:center;padding-inline:clamp(16px,6vw,72px);
  background:radial-gradient(circle at 78% 18%,#3b4470 0,transparent 40%),linear-gradient(180deg,var(--night) 0,var(--night-2) 70%,#3a2c2a 100%);color:#fff}
#start svg.scene{position:absolute;inset:auto 0 0 0;width:100%;height:62%;pointer-events:none}
.brand{position:relative;z-index:2;display:flex;flex-direction:column;gap:22px;max-width:420px}
.brand small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp-soft);opacity:.8}
.brand h1{margin:0;font-size:clamp(40px,8vw,68px);line-height:.95;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.brand h1 span{display:block;color:var(--lamp)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff12;color:#fff;backdrop-filter:blur(6px);transition:background .15s,transform .15s}
.menu button:hover{background:#ffffff22;transform:translateX(3px)}
.menu button.primary{background:var(--accent);border-color:transparent}
.menu button.primary:hover{background:#ef7a4e}
.menu b{display:block;font-weight:600}
.menu em{display:block;font-style:normal;font-size:12px;opacity:.75}
.menu i{width:20px;height:20px;flex:none;display:grid;place-items:center}
.foot{position:absolute;bottom:12px;left:clamp(16px,6vw,72px);font-size:11px;opacity:.5;z-index:2}

/* ---------- MODALS ---------- */
.modal-bg{position:absolute;inset:0;z-index:9500;background:#0b0e18aa;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal{width:min(440px,100%);background:var(--win);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px #0008;animation:pop .25s ease}
.modal .hero{height:150px;position:relative;background:linear-gradient(160deg,#2a3358,#5a3b45)}
.modal .hero svg{position:absolute;inset:0;width:100%;height:100%}
.modal .hero .cap{position:absolute;left:16px;bottom:12px;color:#fff}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#fff;padding:3px 8px;border-radius:6px}
.modal .hero h2{margin:6px 0 2px;font-size:24px;font-weight:800}
.modal .hero p{margin:0;font-size:12px;opacity:.8}
.modal .body{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.55;color:var(--ink-2)}
.modal .body strong{color:var(--ink)}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:13px}
.btn.go{background:var(--accent);color:#fff;border-color:transparent}
.chapters{display:flex;flex-direction:column;gap:8px}
.chapters div{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.chapters div.lock{opacity:.5}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

/* ---------- DESKTOP ---------- */
#desk{position:absolute;inset:0;background:
  radial-gradient(ellipse at 20% 110%,var(--desk-c) 0,transparent 45%),
  radial-gradient(ellipse at 90% 0%,#9fd0c0 0,transparent 50%),
  linear-gradient(160deg,var(--desk-a),var(--desk-b));}
.menubar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;gap:16px;padding-inline:12px;background:#ffffff55;backdrop-filter:blur(14px);font-size:12px;color:#14262a;z-index:8000}
.menubar b{font-weight:700}
.mb-home{border:0;background:#ffffff80;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;color:#14262a}
.mb-home:hover{background:#fff}
.menubar .sp{flex:1}
.menubar .tab{font-variant-numeric:tabular-nums}
.desk-icons{position:absolute;top:44px;right:16px;display:flex;flex-direction:column;gap:14px;z-index:1}
.desk-icons button{width:76px;background:none;border:0;color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 1px 2px #0006}
.dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:18px;background:#ffffff66;backdrop-filter:blur(16px);border:1px solid #ffffff88;z-index:8000;max-width:calc(100% - 32px)}
.dock button{position:relative;width:46px;height:46px;border:0;border-radius:12px;padding:0;background:none;transition:transform .15s}
.dock button:hover{transform:translateY(-6px) scale(1.08)}
.dock button.open::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#14262a}
.dock button .tip{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:#1f2328dd;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.dock button:hover .tip{opacity:1}
.dock .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding-inline:4px}
.ico{width:100%;height:100%;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 -2px 0 #0002}
.ico svg{width:60%;height:60%}

/* windows */
.win{position:absolute;background:var(--win);border-radius:12px;box-shadow:0 22px 60px #0b2a2e55,0 0 0 1px #00000014;display:flex;flex-direction:column;overflow:hidden;min-width:0;animation:pop .2s ease}
.win .bar{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding-inline:12px;background:var(--win-2);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.win .bar:active{cursor:grabbing}
.dots{display:flex;gap:6px}
.dots span{width:12px;height:12px;border-radius:50%;background:#d6d8d3}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;color:transparent;font-size:9px;font-weight:800;line-height:1;position:relative}
.dots button::before{content:"";position:absolute;inset:-4px}
.win .bar:hover .dots button,.dots button:focus-visible{color:#0000008c}
.dots .x{background:#ef6a5e}.dots .m{background:#f4be4f}.dots .f{background:#61c454}
.win.inactive .bar:not(:hover) .dots button{background:#d6d8d3}
.win.max{left:0!important;top:26px!important;width:100%!important;height:calc(100% - 26px - 72px)!important;border-radius:0 0 12px 12px}
.win.max .bar{cursor:default}
.win .bar .t{font-size:12px;font-weight:600;color:var(--ink-2)}
.win .content{flex:1;min-height:0;display:flex;overflow:hidden}
.win.inactive .dots span{background:#d6d8d3}

/* chat */
.chat-list{width:210px;flex:none;border-right:1px solid var(--line);overflow:auto;background:#fff}
.chat-list input{margin:10px;width:calc(100% - 20px);box-sizing:border-box;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--win-2);font:inherit;font-size:12px}
.convo{display:flex;gap:10px;padding:10px;border:0;background:none;width:100%;text-align:left;align-items:center}
.convo.on{background:#e7f2ee}
.convo .meta{min-width:0;flex:1}
.convo b{font-size:13px;display:flex;justify-content:space-between;gap:6px}
.convo b small{font-weight:400;color:var(--ink-3);font-size:11px}
.convo p{margin:2px 0 0;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo .unread{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.chat-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:#eef0ec}
.chat-head{padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.chat-head b{font-size:14px;display:block}.chat-head small{font-size:11px;color:var(--ok)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:11px;background:#d4d8d2;color:var(--ink-2);padding:2px 10px;border-radius:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .bubble{background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.45;box-shadow:0 1px 0 #0000000d;position:relative}
.msg .who{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.msg .time{font-size:10px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.typing{font-size:12px;color:var(--ink-3);font-style:italic;padding-left:42px}
.chat-foot{padding:10px 14px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.pin{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:2px 7px;color:var(--ink-2);display:inline-flex;gap:4px;align-items:center;margin-top:6px}
.pin{opacity:.38;transition:opacity .15s,border-color .15s,color .15s}
.bubble:hover .pin,.fb-cm:hover .pin,.fb-post header:hover .pin,.item:hover .pin,.doc header:hover .pin,.viewer footer:hover .pin,.pin:focus-visible{opacity:.75}
.pin:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
.pin.done{opacity:.7}
.pin.done{background:#fdeee7;border-color:#f3c3ad;color:var(--accent)}

/* browser */
.browser{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--win-2);border-bottom:1px solid var(--line)}
.tabs .nav{border:0;background:none;color:var(--ink-2);font-size:16px;padding:2px 6px;border-radius:6px}
.tabs .nav:hover:not(:disabled){background:#0000000f}
.tabs .nav:disabled{color:#c3c6cb;cursor:default}
.tabs form{flex:1;min-width:0}
.tabs input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;background:#fff}
.page{flex:1;overflow:auto;background:#fff}
.home{padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.home h3{margin:0;font-size:26px;font-weight:800;color:#2d6f73}
.shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,96px));gap:12px}
.shortcuts button{border:1px solid var(--line);background:var(--win-2);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.shortcuts .lg{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800}
.site-head{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;font-weight:800}
.feed{max-width:520px;margin:0 auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.post{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.post header{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post header b{font-size:13px;display:block}.post header small{font-size:11px;color:var(--ink-3)}
.post p{margin:0;font-size:13px;line-height:1.5}
.post .ph{margin-top:8px;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.post .ph svg{width:100%;height:100%;display:block}
.shop-search{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.shop-search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:16px}
.item{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.item .ph{aspect-ratio:4/3;background:#f3f1ea}
.item .ph svg{width:100%;height:100%;display:block}
.item .in{padding:10px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.item .in b{font-size:13px;line-height:1.35}
.item .price{color:var(--bad);font-weight:700;font-variant-numeric:tabular-nums}
.item .sm{color:var(--ink-3);font-size:11px}
.empty{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.notfound{padding:40px 16px;text-align:center;color:var(--ink-2)}
.notfound b{font-size:40px;display:block;color:var(--ink-3)}

/* photos */
.photos{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.photo{border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:6px}
.photo .ph{aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.photo .ph svg{width:100%;height:100%;display:block}
.photo span{font-size:12px;color:var(--ink-2)}
.viewer{flex:1;display:flex;flex-direction:column;background:#1b1d22;color:#fff}
.viewer .ph{flex:1;min-height:0;display:grid;place-items:center;padding:12px}
.viewer .ph svg{max-width:100%;max-height:100%;border-radius:6px}
.viewer footer{padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;background:#24272d}
.viewer footer .pin{margin:0}

/* notebook */
.nb-side{width:190px;flex:none;background:var(--win-2);border-right:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nb-side small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 4px}
.nb-side button{display:flex;justify-content:space-between;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--ink)}
.nb-side button.on{background:#fdeee7;color:var(--accent);font-weight:600}
.nb-side button span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.nb-main{flex:1;min-width:0;overflow:auto;background:var(--paper);background-image:repeating-linear-gradient(var(--paper) 0 27px,var(--paper-line) 27px 28px);padding:14px 18px}
.nb-main h4{margin:0 0 10px;font-size:15px}
.clue{font-family:var(--f-hand);font-size:18px;line-height:28px;color:#2b3a67;display:flex;gap:8px;align-items:flex-start}
.clue em{font-family:var(--f-ui);font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:#fff;border:1px solid #f3c3ad;border-radius:4px;padding:0 5px;margin-top:6px;line-height:16px;flex:none}
.clue button{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:14px;flex:none}
.nb-main textarea{width:100%;box-sizing:border-box;min-height:220px;border:0;background:transparent;resize:vertical;font-family:var(--f-hand);font-size:18px;line-height:28px;color:#2b3a67;padding:0}
.nb-empty{font-family:var(--f-hand);font-size:18px;color:var(--ink-3);line-height:28px}

/* case file */
.file{flex:1;overflow:auto;background:#e9e6dc;padding:18px;display:grid;place-items:start center}
.sheet{width:min(420px,100%);background:#fff;padding:22px;box-shadow:0 6px 18px #0002;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sheet .org{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;color:#2d4a8a;text-transform:uppercase}
.sheet h3{margin:0;text-align:center;font-size:19px;font-weight:800;letter-spacing:.02em}
.sheet .sub{text-align:center;font-size:12px;color:var(--ink-3);font-style:italic}
.sheet label{font-size:13px;font-weight:600}
.sheet input{border:1px solid #b9bcc2;border-radius:6px;padding:9px 10px;font:inherit;font-size:15px}
.sheet .act{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tries{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-3)}
.tries i{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}
.tries i.used{background:#d3d5d8}
.verdict{font-size:13px;padding:10px;border-radius:8px;line-height:1.5}
.verdict.no{background:#fbe9e6;color:#8c2e22}
.answer{background:#f6f3ea;border:1px dashed #cdbf98;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.answer p{margin:4px 0 0}
.answer-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stamp{align-self:center;border:3px solid var(--bad);color:var(--bad);font-weight:800;letter-spacing:.1em;padding:6px 14px;transform:rotate(-6deg);border-radius:6px;font-size:18px}

/* toast & coach */
.toast{position:absolute;top:36px;left:50%;transform:translateX(-50%);background:#1f2328ee;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 8px 20px #0004;animation:pop .2s ease}
.coach{position:absolute;left:16px;bottom:78px;width:min(280px,calc(100% - 32px));background:var(--paper);border:1px solid var(--paper-line);border-radius:12px;padding:12px 14px;z-index:8500;box-shadow:0 12px 30px #0003;font-size:13px;line-height:1.5;color:var(--ink-2)}
.coach b{color:var(--ink)}
.coach>b:first-child{display:block;margin-bottom:4px}
[hidden]{display:none!important}
.coach button{margin-top:8px}
.prog{position:absolute;left:16px;top:38px;z-index:2;background:#ffffffcc;border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;min-width:150px}
.prog .barx{height:6px;border-radius:3px;background:#0000001a;overflow:hidden}
.prog .barx i{display:block;height:100%;background:var(--accent);transition:width .3s}

@media (max-width:720px){
  .win{left:8px!important;right:8px!important;width:auto!important;top:34px!important;bottom:72px!important;height:auto!important}
  .chat-list{width:120px}.convo p,.convo b small{display:none}
  .nb-side{width:120px}
  .desk-icons,.prog{display:none}
  .dock button{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* files app */
.files-list{width:220px;flex:none;border-right:1px solid var(--line);background:var(--win-2);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.files-list small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px}
.files-list button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:7px 8px;border-radius:6px;font-size:12px;text-align:left;color:var(--ink)}
.files-list button.on{background:#dde8f6}
.files-list button svg{width:18px;height:18px;flex:none}
.doc{flex:1;min-width:0;overflow:auto;background:#fff;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.doc pre{margin:0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;color:#2a2f36}
.doc header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.doc header b{font-size:13px}
.doc header .pin{margin:0}

/* suspect board */
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sus-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
.sus-card b{font-size:13px;color:var(--ink)}
.sus-card .tg{display:flex;gap:4px;flex-wrap:wrap}
.sus-card .tg button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:2px 6px;color:var(--ink-2)}
.sus-card .tg button.on.s{background:#fbe9e6;border-color:#eab3a9;color:var(--bad)}
.sus-card .tg button.on.c{background:#e5f3ea;border-color:#a9d6b9;color:var(--ok)}
.sus-card .tg button.on.u{background:#eef0f3;color:var(--ink)}
.sus-card.s{border-color:#eab3a9}.sus-card.c{opacity:.7}

/* case form choices */
.choices{display:flex;flex-direction:column;gap:6px}
.choices label{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.choices label:has(input:checked){border-color:var(--accent);background:#fdeee7}
.choices input{margin-top:2px}
.item .desc{font-size:11px;color:var(--ink-2);line-height:1.4}
.chip.new{background:var(--ok)}
.chapters button.ch{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff;text-align:left;gap:10px}
.chapters button.ch:hover{border-color:var(--accent)}
.chapters button.ch small{display:block;color:var(--ink-3);font-size:11px}
@media (max-width:720px){.files-list{width:120px}.files-list button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.files-list button.sub{padding-left:24px}
.files-list button .lk{margin-left:auto;font-style:normal;font-size:11px}
.lockbox{align-items:center;justify-content:center}
.lk-card{max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.lk-ico{font-size:30px}
.lk-card p{margin:0;font-size:13px;color:var(--ink-2)}
.lk-card .hint{background:var(--win-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--ink)}
.pwf{display:flex;gap:6px;width:100%}
.pwf input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}
.pw-err{color:var(--bad);font-size:12px}
.meta-line{font-size:11px;color:var(--ink-3)}
.tag-r{font-size:10px;font-weight:700;background:#e6f3ec;color:var(--ok);border-radius:4px;padding:1px 6px;margin-left:6px}

/* Mặt Sách */
.fb-top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.fb-logo{font-weight:800;color:#3c6fd1;font-size:17px;border:0;background:none;padding:0;white-space:nowrap}
.fb-top form{flex:1;min-width:0;max-width:300px}
.fb-top input{width:100%;box-sizing:border-box;border:0;border-radius:999px;background:#eef0f4;padding:7px 14px;font:inherit;font-size:13px}
.fb-body{background:#f0f2f5;min-height:100%;padding-bottom:16px}
.fb-wrap{max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.fb-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 2px #0000001a}
.fb-card h5{margin:0 0 8px;font-size:15px}
.fb-cover{height:110px;border-radius:0 0 10px 10px}
.fb-id{display:flex;align-items:flex-end;gap:12px;margin:-42px 0 0 16px;padding-right:12px;flex-wrap:wrap}
.fb-id .av{width:84px;height:84px;font-size:30px;border:4px solid #fff}
.fb-id b{font-size:20px;display:block;line-height:1.2}
.fb-id small{font-size:12px;color:var(--ink-3)}
.fb-id .hd{color:#3c6fd1}
.fb-intro{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);line-height:1.45}
.fb-intro p{margin:0 0 4px;text-align:center;color:var(--ink)}
.fb-friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.fb-friends button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#3c6fd1;text-align:center}
.fb-friends .av{width:52px;height:52px;font-size:18px}
.fb-friends button:hover b{text-decoration:underline}
.fb-friends b{font-weight:600}
.fb-post header{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fb-post header b{font-size:13px;display:block}
.fb-post header small{font-size:11px;color:var(--ink-3)}
.fb-post header .pin{margin:0 0 0 auto}
.fb-post>p{margin:0;font-size:13.5px;line-height:1.5}
.fb-post .ph{margin-top:8px;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.fb-post .ph svg{width:100%;height:100%;display:block}
.fb-stats{font-size:12px;color:var(--ink-3);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.fb-cm{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.fb-cm .av{width:28px;height:28px;font-size:11px}
.fb-cm .bb{background:#f0f2f5;border-radius:14px;padding:6px 11px;font-size:13px;line-height:1.45;min-width:0}
.fb-cm .bb b{font-size:12px;display:block}
.fb-cm .meta{font-size:11px;color:var(--ink-3);margin:3px 0 0 11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb-cm .meta .pin{margin:0;padding:0 6px}
.fb-name{border:0;background:none;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.fb-cm .bb .fb-name,.fb-cm .bb b{display:block;font-size:12px;margin-bottom:1px;text-align:left}
.fb-name:hover{text-decoration:underline}
.fb-res{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:8px;border-radius:8px;text-align:left}
.fb-res:hover{background:#f0f2f5}
.fb-res .av{width:52px;height:52px;font-size:18px}
.fb-res b{font-size:14px;display:block}.fb-res small{font-size:12px;color:var(--ink-3)}
.fb-hint{font-size:13px;color:var(--ink-2);line-height:1.55;margin:0}
.lnk{border:0;background:none;padding:0;font:inherit;color:#2f6fd1;text-decoration:underline;cursor:pointer;word-break:break-all}
.chip.pg{background:#6b6f7a}
</style>

let CH=CHAPTERS[0];
const S={};
function freshState(ci){Object.assign(S,{ch:ci,pinned:new Set(),open:{},z:10,chat:CHAPTERS[ci].lead,tries:3,solved:false,url:"",notes:"",nbFilter:"all",
  unread:Object.fromEntries(Object.keys(CHAPTERS[ci].chats).filter(k=>k!==CHAPTERS[ci].lead).map(k=>[k,true])),leadShown:0,photo:null,fileSel:null,verdict:"",extra:[],shopQ:"",marks:{},how:"",seenFiles:false,pinData:{},hist:[""],hi:0,reveal:false,unlocked:new Set(),restored:new Set(),pwErr:{},folder:null,rsK:null})}
let done=new Set();
try{(JSON.parse(localStorage.getItem("tthn-done")||"[]")).forEach(i=>done.add(i))}catch(e){}
const saveDone=()=>{try{localStorage.setItem("tthn-done",JSON.stringify([...done]))}catch(e){}};

const $=(s,r=document)=>r.querySelector(s);
const h=html=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().trim().replace(/\s+/g," ");
const keyTotal=()=>Object.values(CH.clues).filter(c=>c.key).length;
const pwNorm=s=>norm(s).replace(/[^a-z0-9]/g,"");
const driveF=k=>(CH.drive?CH.drive.folders:[]).find(f=>f.k===k);
const isOpen=f=>!f.lock||S.unlocked.has(f.k);
const passOk=(f,input)=>f.lock.pass.some(p=>pwNorm(p)===pwNorm(input||""));
function tryUnlock(k,input){const f=driveF(k);if(!f)return false;if(isOpen(f))return true;
  if(passOk(f,input)){S.unlocked.add(k);delete S.pwErr["d:"+k];return true}
  S.pwErr["d:"+k]=(input||"").trim()?"Sai mật khẩu.":"Nhập mật khẩu trước đã.";return false}
const folderFiles=f=>Object.entries(f.files).concat((CH.trash||[]).filter(t=>t.kind==="file"&&t.from===f.k&&S.restored.has(t.k))
  .map(t=>["t."+t.k,{n:t.n,x:t.x,m:t.when,restored:1,info:t.info}]));
const fileCount=()=>Object.keys(CH.files).length+(CH.drive?CH.drive.folders.length:0);

function toast(m){const t=h(`<div class="toast" role="status">${m}</div>`);$("#layer").append(t);setTimeout(()=>t.remove(),1900)}
function nav(u){u=u||"";if(u===S.url)return;S.hist=S.hist.slice(0,S.hi+1);S.hist.push(u);S.hi=S.hist.length-1;S.url=u}
function histGo(d){const i=S.hi+d;if(i<0||i>=S.hist.length)return;S.hi=i;S.url=S.hist[i]}
const REG={};
function pinOf(id,src,who,x){REG[id]={src,x:(who?who+": ":"")+x};return pinBtn(id)}
function pinBtn(id){const on=S.pinned.has(id);return `<button class="pin ${on?"done":""}" data-pin="${id}">📌 ${on?"Đã ghim":"Ghim"}</button>`}
function updateProg(){$("#pc").textContent=S.pinned.size}
function pin(id){
  if(S.pinned.has(id)){S.pinned.delete(id);toast("Đã bỏ ghim")}else{S.pinned.add(id);S.pinData[id]=REG[id];toast("Đã ghim vào Sổ vụ án")}
  updateProg();refreshAll();
}

const GEOM={chat:[40,60,580,420],web:[300,80,580,460],files:[120,100,560,380],photos:[160,140,460,380],nb:[220,70,560,420],file:[380,100,460,470]};

function renderDock(){
  const d=$("#dock");d.innerHTML="";
  for(const [k,a] of Object.entries(ICONS)){
    const b=h(`<button data-open="${k}" aria-label="${a.n}" class="${S.open[k]?"open":""}"><div class="ico" style="background:${a.bg}"><svg viewBox="0 0 24 24">${a.svg}</svg></div><span class="tip">${a.n}</span></button>`);
    if(k==="chat"){const u=Object.values(S.unread).filter(Boolean).length;if(u)b.append(h(`<span class="badge">${u}</span>`))}
    if(k==="nb"&&S.pinned.size)b.append(h(`<span class="badge" style="background:#c98a2f">${S.pinned.size}</span>`));
    if(k==="files"&&fileCount()&&!S.seenFiles)b.append(h(`<span class="badge" style="background:#3d8fd1">${fileCount()}</span>`));
    d.append(b);
  }
}
function openApp(k){
  if(k==="files")S.seenFiles=true;
  if(S.open[k]){S.open[k].hidden=false;focus(S.open[k]);renderDock();return}
  const [x,y,w,hh]=GEOM[k];const W=$("#desk").clientWidth,H=$("#desk").clientHeight;
  const win=h(`<div class="win" data-app="${k}" role="dialog" aria-label="${ICONS[k].n}">
    <div class="bar"><div class="dots"><button class="x" aria-label="Đóng" title="Đóng">×</button><button class="m" aria-label="Thu nhỏ xuống Dock" title="Thu nhỏ">–</button><button class="f" aria-label="Phóng to" title="Phóng to / Thu về">+</button></div><span class="t">${ICONS[k].n}</span></div>
    <div class="content"></div></div>`);
  win.style.left=Math.max(8,Math.min(x,W-w-8))+"px";win.style.top=Math.max(34,Math.min(y,H-hh-80))+"px";
  win.style.width=Math.min(w,W-16)+"px";win.style.height=Math.min(hh,H-110)+"px";
  $("#wins").append(win);S.open[k]=win;
  $(".x",win).onclick=e=>{e.stopPropagation();win.remove();delete S.open[k];renderDock();updateMenu()};
  $(".m",win).onclick=e=>{e.stopPropagation();win.hidden=true;updateMenu();toast(`Đã thu nhỏ ${ICONS[k].n}. Bấm icon trên Dock để mở lại.`)};
  const zoom=()=>{win.classList.toggle("max");$(".f",win).setAttribute("aria-label",win.classList.contains("max")?"Thu về":"Phóng to")};
  $(".f",win).onclick=e=>{e.stopPropagation();zoom()};
  $(".bar",win).ondblclick=e=>{if(!e.target.closest("button"))zoom()};
  win.addEventListener("pointerdown",()=>focus(win));
  drag(win);render(k);focus(win);renderDock();
}
function focus(win){win.style.zIndex=++S.z;document.querySelectorAll(".win").forEach(w=>w.classList.toggle("inactive",w!==win));updateMenu(win.dataset.app)}
function updateMenu(k){$("#mb-app").textContent=k?ICONS[k].n:"Phố Xanh"}
function drag(win){
  const bar=$(".bar",win);let sx,sy,ox,oy,on=false;
  bar.addEventListener("pointerdown",e=>{if(e.target.closest("button")||innerWidth<=720||win.classList.contains("max"))return;on=true;sx=e.clientX;sy=e.clientY;ox=win.offsetLeft;oy=win.offsetTop;bar.setPointerCapture(e.pointerId)});
  bar.addEventListener("pointermove",e=>{if(!on)return;win.style.left=(ox+e.clientX-sx)+"px";win.style.top=Math.max(26,oy+e.clientY-sy)+"px"});
  bar.addEventListener("pointerup",()=>on=false);
}

    if(S.solved) return `<div class="file"><div class="sheet">${head}<div class="stamp" style="border-color:var(--ok);color:var(--ok)">ĐÃ PHÁ ÁN</div>
      <p style="font-size:13px;line-height:1.6;margin:0">Thủ phạm: <b>${CH.culprit}</b>. ${CH.solution}</p>
      <div class="act"><span style="display:flex;gap:8px"><button class="btn" data-home>⌂ Màn hình chính</button><button class="btn" data-restart>Chơi lại</button></span>${next?`<button class="btn go" data-next>Chương ${S.ch+2}: ${next.title} →</button>`:`<span class="tries">Chương mới sắp ra mắt</span>`}</div></div></div>`;
    if(S.tries<=0){const how=CH.form.how?CH.form.how.opts.find(o=>o.v===CH.form.how.a).l:"";
      return `<div class="file"><div class="sheet">${head}<div class="stamp">ANH TI TỰ XỬ</div>
      <p style="font-size:13px;margin:0;line-height:1.6">Hết 3 lần gửi rồi. Anh Ti sẽ kể chuyện này ở tổ dân phố đó.</p>
      ${S.reveal?`<div class="answer"><div class="answer-h">Đáp án</div><p>Thủ phạm: <b>${CH.culprit}</b>${how?`<br>${CH.form.how.label}: <b>${how}</b>`:""}</p><p>${CH.solution}</p></div>`:
        `<p style="font-size:12px;margin:0;color:var(--ink-3)">Muốn tự phá lại thì bấm Chơi lại. Chịu thua thì xem đáp án.</p>`}
      <div class="act"><span style="display:flex;gap:8px"><button class="btn" data-home>⌂ Màn hình chính</button><button class="btn" data-restart>Chơi lại</button></span>${S.reveal?(next?`<button class="btn go" data-next>Chương ${S.ch+2}: ${next.title} →</button>`:""):`<button class="btn go" data-reveal>Xem đáp án</button>`}</div></div></div>`}
    const how=CH.form.how;
    return `<div class="file"><form class="sheet" id="acc">${head}
      <label for="acc-in">${CH.form.q}</label><input id="acc-in" autocomplete="off" placeholder="Ví dụ: Nguyễn Văn A">
      ${how?`<label>${how.q}</label><div class="choices">${how.opts.map(o=>`<label><input type="radio" name="how" id="how-${o.v}" value="${o.v}" ${S.how===o.v?"checked":""}>${o.l}</label>`).join("")}</div>`:""}
      ${S.verdict?`<div class="verdict no">${S.verdict}</div>`:""}
      <div class="act"><span class="tries">${dots} Còn ${S.tries}/3 lần gửi</span><button class="btn go">Gửi anh Ti</button></div></form></div>`;
  }
};
/* ---------- Mặt Sách ---------- */
function fbFind(q){q=norm(q).replace(/^@/,"").replace(/^matsach\.vn\//,"");if(!q)return[];
  return Object.entries(CH.profiles).filter(([hd,p])=>[hd,...(p.alias||[])].includes(q)||(q.split(" ").length>=2&&norm(p.n).includes(q)))}
const fbAv=(hd,p,sz)=>`<div class="av" style="background:${p.c}${sz?`;width:${sz}px;height:${sz}px`:""}">${p.i}</div>`;
function fbWho(cm){const p=cm.h&&CH.profiles[cm.h];return p?{p,hd:cm.h}:{p:{n:cm.n,i:norm(cm.n).split(" ").pop()[0].toUpperCase(),c:"#9aa0aa"}}}
function fbWhen(t){const today=(CH.day.match(/(\d+)\/(\d+)/)||[]).slice(1).map(Number);let d,m;
  if(/^Hôm nay/.test(t))[d,m]=today;else if(/^Hôm qua/.test(t))[d,m]=[today[0]-1,today[1]];
  else{const x=t.match(/(\d+) tháng (\d+)/);[d,m]=x?[+x[1],+x[2]]:[0,0]}
  const hm=(t.match(/(\d{1,2}):(\d{2})/)||[0,0,0]);return ((m*40+d)*24+ +hm[1])*60+ +hm[2]}
const fbSorted=posts=>posts.map((po,pi)=>[po,pi]).sort((a,b)=>fbWhen(b[0].t)-fbWhen(a[0].t));
function fbPage(u){
  const path=u.replace(/^matsach\.vn\/?/,"");
  const top=`<div class="fb-top"><button class="fb-logo" data-go="matsach.vn">mặt sách</button><form id="fb-f"><input id="fb-q" placeholder="Tìm kiếm trên Mặt Sách" aria-label="Tìm kiếm trên Mặt Sách" value="${path.startsWith("search?q=")?esc(decodeURIComponent(path.slice(9))):""}"></form></div>`;
  let body;
  if(!path) body=`<div class="fb-wrap"><div class="fb-card"><h5>Tìm người hoặc trang</h5><p class="fb-hint">Gõ <b>họ tên đầy đủ</b> (ví dụ: Nguyễn Văn A) hoặc <b>tên tài khoản</b> rồi nhấn Enter. Tên trong tin nhắn, tệp hay bình luận đều là đầu mối.</p></div></div>`;
  else if(path.startsWith("search?q=")){const q=decodeURIComponent(path.slice(9));const r=fbFind(q);
    body=`<div class="fb-wrap"><div class="fb-card"><h5>Kết quả cho “${esc(q)}”</h5>${r.length?r.map(([hd,p])=>`<button class="fb-res" data-go="matsach.vn/${hd}">${fbAv(hd,p)}<span><b>${p.n}</b><small>${p.page?"Trang":"Cá nhân"} · ${esc(p.bio)}</small></span></button>`).join(""):
      `<p class="fb-hint">Không tìm thấy kết quả cho “${esc(q)}”. Thử gõ đủ họ và tên, hoặc đúng tên tài khoản.</p>`}</div></div>`}
  else{const p=CH.profiles[path]||Object.values(CH.profiles).find(x=>(x.alias||[]).includes(path));
    if(!p) body=`<div class="fb-wrap"><div class="fb-card"><h5>Trang này không tồn tại</h5><p class="fb-hint">Liên kết có thể bị sai hoặc tài khoản đã bị xóa.</p></div></div>`;
    else{const hd=CH.profiles[path]?path:Object.keys(CH.profiles).find(k=>CH.profiles[k]===p);
      const fr=p.friends.filter(f=>CH.profiles[f]);
      body=`<div class="fb-wrap" style="gap:0;padding-top:0"><div class="fb-cover" style="background:linear-gradient(120deg,${p.c},#2b3356)"></div>
        <div class="fb-id">${fbAv(hd,p)}<div><b>${p.n}</b><small><span class="hd">matsach.vn/${hd}</span> · ${p.page?"Trang":`${p.friends.length} bạn bè`}</small></div></div></div>
        <div class="fb-wrap">
        <div class="fb-card fb-intro"><h5>Giới thiệu</h5><p>${esc(p.bio)}</p>${p.live?`<span>🏠 Sống tại ${p.live}</span>`:""}${p.from?`<span>📍 Đến từ ${p.from}</span>`:""}</div>
        ${fr.length?`<div class="fb-card"><h5>Bạn bè</h5><div class="fb-friends">${fr.map(f=>`<button data-go="matsach.vn/${f}">${fbAv(f,CH.profiles[f])}<b>${CH.profiles[f].n}</b></button>`).join("")}</div></div>`:""}
        ${fbSorted(p.posts).map(([po,pi])=>`<article class="fb-card fb-post"><header>${fbAv(hd,p,36)}<div><b>${p.n}</b><small>${po.t}</small></div>${pinOf(`p:${hd}:${pi}`,"Mặt Sách",p.n,po.x+" ("+po.t+")")}</header>
          <p>${esc(po.x)}</p>${po.svg?`<div class="ph">${hero(po.svg)}</div>`:""}
          <div class="fb-stats">👍 ${po.likes} · ${po.cm.length} bình luận</div>
          ${po.cm.map((cm,ci)=>{const w=fbWho(cm);return `<div class="fb-cm">${fbAv(w.hd,w.p,28)}<div style="min-width:0"><div class="bb">${w.hd?`<button class="fb-name" data-go="matsach.vn/${w.hd}">${w.p.n}</button>`:`<b>${esc(w.p.n)}</b>`}${esc(cm.x)}</div>
            <div class="meta"><span>${cm.t}</span>${pinOf(`p:${hd}:${pi}:${ci}`,"Mặt Sách",w.p.n,cm.x+" ("+cm.t+")")}</div></div></div>`}).join("")}
        </article>`).join("")}</div>`}}
  return `<div class="fb-body">${top}${body}</div>`;
}
function shopItems(){const q=norm(S.shopQ||"");const it=CH.shop.filter(i=>!q||norm(i.n).includes(q)||i.k.includes(q)||norm(i.s).includes(q));
  return it.length?it.map(i=>`<div class="item"><div class="ph">${hero(i.svg)}</div><div class="in"><b>${i.n}</b><span class="price">${i.p}</span>${i.d?`<span class="desc">${esc(i.d)}</span>`:""}<span class="sm">${i.s}</span><span class="sm">${i.t}</span>${pinOf("s:"+i.s+i.p,"Chợ Hẻm",i.s,i.n+" · "+i.p+(i.d?" · "+i.d:"")+" · "+i.t)}</div></div>`).join(""):`<div class="empty">Không có món nào khớp “${esc(S.shopQ)}”.</div>`}

function bind(k,c){
  c.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>pin(b.dataset.pin));
  if(k==="chat"){
    c.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>{S.chat=b.dataset.chat;S.unread[S.chat]=false;render("chat");renderDock()});
    c.querySelectorAll("[data-link]").forEach(b=>b.onclick=()=>{nav(b.dataset.link);openApp("web");render("web")});
    const q=$("#chat-q",c);q.oninput=()=>{const v=norm(q.value);c.querySelectorAll(".convo").forEach(b=>{const txt=norm(CH.chats[b.dataset.chat].map(m=>(m.x||"")+" "+(m.who||"")).join(" ")+CH.people[b.dataset.chat].n);b.hidden=v&&!txt.includes(v)})};
  }
  if(k==="web"){
    c.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{nav(b.dataset.go);render("web");const pg=c.querySelector(".page");if(pg)pg.scrollTop=0});
    $("#addr",c).onsubmit=e=>{e.preventDefault();nav($("#addr-in",c).value.trim().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/$/,""));render("web");const pg=c.querySelector(".page");if(pg)pg.scrollTop=0};
    c.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>{histGo(+b.dataset.hist);render("web");const pg=c.querySelector(".page");if(pg)pg.scrollTop=0});
    const ff=$("#fb-f",c);if(ff)ff.onsubmit=e=>{e.preventDefault();const q=$("#fb-q",c).value.trim();nav("matsach.vn"+(q?"/search?q="+encodeURIComponent(q):""));render("web")};
    const f=$("#shop-f",c);if(f)f.onsubmit=e=>{e.preventDefault();S.shopQ=$("#shop-q",c).value;render("web")};
  }
  if(k==="files"){
    c.querySelectorAll("[data-fsel]").forEach(b=>b.onclick=()=>{const [fo,fk]=b.dataset.fsel.split("|");S.folder=fo;S.fileSel=fk;render("files")});
    c.querySelectorAll("[data-fold]").forEach(b=>b.onclick=()=>{S.folder=b.dataset.fold;S.fileSel=null;render("files");const i=$("#pw-in",S.open.files);if(i)i.focus()});
    const pf=$("#pw-f",c);if(pf)pf.onsubmit=e=>{e.preventDefault();const ok=tryUnlock(S.folder,$("#pw-in",c).value);if(ok)toast("Đã mở khóa thư mục");render("files");if(!ok){const i=$("#pw-in",S.open.files);if(i)i.focus()}};
  }
  if(k==="photos"){c.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>{S.photo=b.dataset.photo;render("photos")});const bk=$("[data-back]",c);if(bk)bk.onclick=()=>{S.photo=null;render("photos")}}
  if(k==="nb"){
    c.querySelectorAll("[data-nb]").forEach(b=>b.onclick=()=>{S.nbFilter=b.dataset.nb;render("nb")});
    c.querySelectorAll("[data-mark]").forEach(b=>b.onclick=()=>{const [id,m]=b.dataset.mark.split(":");S.marks[id]=m;render("nb",true)});
    const t=$("#notes",c);if(t)t.oninput=()=>S.notes=t.value}
  if(k==="file"){
    const f=$("#acc",c);if(f){f.onsubmit=e=>{e.preventDefault();const r=f.querySelector("input[name=how]:checked");accuse($("#acc-in",c).value,r?r.value:"")};
      f.querySelectorAll("input[name=how]").forEach(r=>r.onchange=()=>S.how=r.value)}
    const hm=$("[data-home]",c);if(hm)hm.onclick=goHome;
    const rv=$("[data-reveal]",c);if(rv)rv.onclick=()=>{S.reveal=true;render("file")};
    const r=$("[data-restart]",c);if(r)r.onclick=()=>startChapter(S.ch);
    const nx=$("[data-next]",c);if(nx)nx.onclick=()=>showIntro(S.ch+1);
  }
}

function accuse(name,how){
  const n=norm(name);
  if(!n){S.verdict="Hãy ghi họ tên đầy đủ trước khi gửi.";render("file");return}
  if(CH.form.how&&!how){S.verdict=CH.form.how.need;render("file");return}
  const r=CH.check(n,how);
  if(r.ok){S.solved=true;S.verdict="";done.add(S.ch);saveDone();render("file");say(CH.win);return}
  S.tries--;S.verdict=r.m;render("file");
  say(S.tries>0?`Sai rồi em. Còn ${S.tries} lần thôi đó 😏`:"Hết lượt rồi. Thôi để anh tự làm vậy.");
}
function say(x){const [hh,mm]=CH.start;const t=hh*60+mm+5+S.extra.length;S.extra.push({t:`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`,x});
  S.unread[CH.lead]=!(S.open.chat&&S.chat===CH.lead);if(S.open.chat)render("chat");renderDock()}

/* ================= FLOW ================= */
function modal(html,onReady){const m=h(`<div class="modal-bg">${html}</div>`);$("#layer").append(m);onReady&&onReady(m);return m}
function showIntro(ci){
  const c=CHAPTERS[ci];
  document.querySelectorAll(".modal-bg").forEach(m=>m.remove());
  modal(`<div class="modal" role="dialog" aria-label="Giới thiệu vụ án"><div class="hero">${hero(c.art)}
  <div class="cap"><span class="chip">Chương ${ci+1}</span><h2>${c.title}</h2><p>${c.place}</p></div></div>
  <div class="body"><p style="margin:0">${c.intro}</p>
  <strong>${ci===0?"Sẵn sàng phá vụ án đầu tiên chưa?":"Vụ này khó hơn. Sẵn sàng chưa?"}</strong><div class="row"><button class="btn" data-x>Để sau</button><button class="btn go" data-ok>Sẵn sàng!</button></div></div></div>`,
  m=>{$("[data-x]",m).onclick=()=>m.remove();$("[data-ok]",m).onclick=()=>{m.remove();startChapter(ci)}});
}
function nextCh(){const i=CHAPTERS.findIndex((c,i)=>!done.has(i));return i<0?CHAPTERS.length-1:i}
function playLabel(){const i=nextCh();$("#b-play").querySelector("em").textContent=`Chương ${i+1} · ${CHAPTERS[i].title}`}
function chapterListHTML(){const nx=nextCh();
  return CHAPTERS.map((c,i)=>{const nw=i>0&&i===nx&&!done.has(i);
    return `<button class="ch" data-ch="${i}"><span><b>${i+1}.</b> ${c.title}<small>${c.place}</small></span><span class="chip ${nw?"new":""}">${done.has(i)?"Đã phá":nw?"Mới":"Mở"}</span></button>`}).join("")}
$("#b-play").onclick=()=>showIntro(nextCh());
playLabel();
$("#b-chap").onclick=()=>modal(`<div class="modal"><div class="body"><strong style="font-size:18px">Chọn chương</strong><div class="chapters">
  ${chapterListHTML()}</div>
  <div class="row"><button class="btn" data-x>Đóng</button></div></div></div>`,m=>{$("[data-x]",m).onclick=()=>m.remove();
  m.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>showIntro(+b.dataset.ch))});
$("#b-how").onclick=()=>modal(`<div class="modal"><div class="body"><strong style="font-size:18px">Cách chơi</strong>
  <p style="margin:0">Bạn ngồi trước một chiếc máy tính. Mở các ứng dụng dưới thanh Dock: đọc tin nhắn trong <b>Nhắn</b>, gõ địa chỉ web trong <b>Lướt</b>, mở tài liệu trong <b>Tệp</b>, xem <b>Ảnh</b>.</p>
  <p style="margin:0">Thấy chi tiết đáng ngờ thì bấm <b>📌 Ghim</b> để lưu vào <b>Sổ vụ án</b>. Ở đó còn có bảng <b>Nghi phạm</b> để đánh dấu ai bị nghi, ai ngoại phạm.</p>
  <p style="margin:0">Khi chắc chắn, điền vào <b>Hồ sơ</b> và gửi. Bạn chỉ có 3 lần gửi.</p>
  <div class="row"><button class="btn go" data-x>Hiểu rồi</button></div></div></div>`,m=>$("[data-x]",m).onclick=()=>m.remove());

function goHome(){document.querySelectorAll(".win,.coach,.modal-bg").forEach(w=>w.remove());clearTimeout(stepTimer);clearTimeout(tick.t);
  $("#desk").hidden=true;$("#start").hidden=false;
  playLabel()}
$("#mb-home").onclick=()=>{if(S.solved||S.tries<=0){goHome();return}
  modal(`<div class="modal" role="dialog" aria-label="Về màn hình chính"><div class="body"><strong style="font-size:17px">Về màn hình chính?</strong>
  <p style="margin:0">Vụ án đang điều tra dở. Nếu thoát bây giờ, các manh mối đã ghim và ghi chú của vụ này sẽ mất.</p>
  <div class="row"><button class="btn" data-x>Ở lại điều tra</button><button class="btn go" data-ok>Về màn hình chính</button></div></div></div>`,
  m=>{$("[data-x]",m).onclick=()=>m.remove();$("[data-ok]",m).onclick=goHome})};
let stepTimer;
function startChapter(ci){
  document.querySelectorAll(".win,.coach").forEach(w=>w.remove());clearTimeout(stepTimer);
  CH=CHAPTERS[ci];freshState(ci);
  $("#start").hidden=true;$("#desk").hidden=false;$("#desk-label").textContent=CH.deskLabel;
  updateProg();renderDock();openApp("chat");
  const step=()=>{if(S.leadShown<CH.chats[CH.lead].length-1){S.leadShown++;if(S.open.chat&&S.chat===CH.lead)render("chat");stepTimer=setTimeout(step,1300)}else coach()};
  stepTimer=setTimeout(step,700);
  mins=0;tick();
}
function coach(){if(S.ch>0||!CH.coach||$(".coach"))return;const c=h(`<div class="coach"><b>Mẹo của thám tử</b>${CH.coach}<br><button class="btn" data-x>Đã hiểu</button></div>`);$("#desk").append(c);$("[data-x]",c).onclick=()=>c.remove()}
let mins=0;function tick(){const t=CH.start[0]*60+CH.start[1]+mins;$("#clock").textContent=`${CH.day} · ${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;
  clearTimeout(tick.t);tick.t=setTimeout(()=>{mins=Math.min(19,mins+1);tick()},30000)}

document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o){openApp(o.dataset.open);if(o.dataset.open==="chat"&&S.unread[S.chat]){S.unread[S.chat]=false;render("chat");renderDock()}}});

</script>

</body>
</html>
